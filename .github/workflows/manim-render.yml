name: Render Manim animation

on:
  push:
    paths:
      - "animations/**"
      - ".github/workflows/manim-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg texlive-latex-extra texlive-fonts-recommended dvisvgm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Manim
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim

      - name: Render vertical video
        run: |
          manim -qh animations/convergence.py ConvergenceShort --media_dir media

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: maths4-convergence-video
          path: media/videos/convergence/1080p60/ConvergenceShort.mp4
          if-no-files-found: error
          retention-days: 14
